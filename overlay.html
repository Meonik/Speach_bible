<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speach-verse</title>
  <style>
    body{
      background: transparent;
      color: black;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 36px;
      text-align: center;
      margin-top: 20vh;
    }
  </style>
</head>
<body>
  <div id="verse">Waiting...</div>

  <script>
    const source = new EventSource('/verse-stream');  //a builting-in API for receiving a continuous stream of messages from a server over HTTP(SSE)
    source.onmessage = function(e){  // defines what happens when the server sends a new message. the yeilded message is wrapped in the event object 'e'
      document.getElementById("verse").innerText = e.data;
    };
  </script>
</body>
</html>
